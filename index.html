<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不让搜索引擎收录 -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121212">
<title>恒温箱 | 气温U的个人博客</title>
<style>
  :root {
    --bg: #121212;
    --hint: #e8e8e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    /* 视口垂直居中兜底 */
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    cursor: default;
    user-select: none;
  }

  /* 极轻微的中央辉光，只为让纯黑不至于像“页面挂了” */
  body::before {
    content: "";
    position: fixed;
    left: 50%;
    top: 50%;
    width: 60vmin;
    height: 60vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,0.028) 0%, rgba(255,255,255,0) 68%);
    pointer-events: none;
  }

  .fade-in {
    animation: fadeIn 1.8s ease-out both;
  }

  .standby {
    position: relative;
    display: block;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", "Courier New", monospace;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.22em;
    /* 让字距补偿末位多出的空隙，视觉上真正居中 */
    text-indent: 0.22em;
    color: var(--hint);
    opacity: 0.3;
    white-space: nowrap;
    animation: breathe 7s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.26; }
    50%      { opacity: 0.34; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 0.3; }
  }

  @media (max-width: 420px) {
    .standby {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade-in, .standby { animation: none; opacity: 0.3; }
  }
</style>
</head>
<body>

  <div class="fade-in">
    <div class="standby" role="status" aria-live="polite">[ SYSTEM STANDBY ]</div>
  </div>

<script>
  (function () {
    var ORIGINAL_TITLE = '恒温箱 | 气温U的个人博客';
    var SUSPENDED_TITLE = '[ 已挂起 ]';

    // 页面初始标题即使用常量写入，保证恢复时绝对一致
    document.title = ORIGINAL_TITLE;

    function handleVisibility() {
      document.title = document.hidden ? SUSPENDED_TITLE : ORIGINAL_TITLE;
    }

    document.addEventListener('visibilitychange', handleVisibility);

    // 兼容老浏览器：窗口失焦/聚焦也做一次兜底
    window.addEventListener('blur', function () {
      if (document.hidden) document.title = SUSPENDED_TITLE;
    });
    window.addEventListener('focus', function () {
      if (!document.hidden) document.title = ORIGINAL_TITLE;
    });

    // 从 bfcache 返回时校正标题
    window.addEventListener('pageshow', handleVisibility);
  })();
</script>
</body>
</html>
